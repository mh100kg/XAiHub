name: Integrate custom iOS features

on:
  push:
    branches: ["upstream-hghubx-1.3.0"]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: upstream-hghubx-1.3.0
      - name: Reapply custom commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for commit in \
            bece140bbe3261dc1a93e8adad27a83df07f4c63 \
            5b8a2047808b7906d7b6e733fb2a107a3b274200 \
            2d74e95727b10fa81b4c7aa539efadc8598670f0 \
            54e59fdb5ffbcbe3cbf6da0cc6293433d491b77d
          do
            git cherry-pick -X theirs "$commit" || {
              git status --short
              exit 1
            }
          done
      - name: Push integrated source
        run: git push origin HEAD:refs/heads/update-hghubx-1.3.0 --force-with-lease=refs/heads/update-hghubx-1.3.0:54e59fdb5ffbcbe3cbf6da0cc6293433d491b77d
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify web build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
